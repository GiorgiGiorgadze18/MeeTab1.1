name: MeeTab backend security smoke tests
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout reviewed commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Backend JavaScript syntax
        run: node --check backend/server.js
      - name: Browser integration JavaScript syntax
        run: node --check website/auth.js && node --check website/site-config.js
      - name: Isolated OAuth, calendar, ACL, IT and rate-limit smoke tests
        run: node tests/backend-smoke.cjs
