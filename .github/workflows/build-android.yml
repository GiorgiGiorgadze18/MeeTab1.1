name: Build and verify MeeTab Android APK variants
on:
  pull_request:
    branches: [main, 'release/meetab-integrated-preview-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build isolated staging and production packages
        working-directory: android
        run: gradle :app:assembleStagingDebug :app:assembleProductionDebug :app:assembleProductionRelease --no-daemon
      - name: Verify actual APK configuration, identity and debug signature
        env:
          MEETAB_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 tests/verify-android-apks.py
      - name: Upload APK for owner validation
        uses: actions/upload-artifact@v4
        with:
          name: MeeTab-staging-debug-apk
          path: |
            android/app/build/outputs/apk/staging/debug/app-staging-debug.apk
            android/app/build/apk-evidence.json
          if-no-files-found: error
          retention-days: 7
