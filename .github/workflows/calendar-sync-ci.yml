name: MeeTab calendar sync regression tests
on:
  pull_request:
    branches: [main, 'release/meetab-integrated-preview-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test calendar polling and safe refresh
        run: node tests/calendar-sync.test.cjs
      - name: Test IT recipient loading and editor visibility
        run: node tests/it-help-loading.cjs
      - name: Check Android kiosk admin onboarding controls
        run: node tests/android-kiosk-security.cjs
