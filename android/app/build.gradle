plugins { id 'com.android.application' }
android {
    namespace 'ge.evex.meetab'
    compileSdk 35
    defaultConfig {
        applicationId 'ge.evex.meetab'; minSdk 23; targetSdk 35; versionCode 5; versionName '1.1.3'
        manifestPlaceholders = [meetabLabel: 'MeeTab', meetabAuthScheme: 'meetab']
        buildConfigField 'String', 'AUTH_SCHEME', '"meetab"'
    }
    buildFeatures { buildConfig true }
    flavorDimensions 'environment'
    productFlavors {
        production { dimension 'environment' }
        staging {
            dimension 'environment'
            applicationIdSuffix '.staging'
            versionNameSuffix '-staging'
            manifestPlaceholders = [meetabLabel: 'MeeTab Staging', meetabAuthScheme: 'meetab-staging']
            buildConfigField 'String', 'AUTH_SCHEME', '"meetab-staging"'
        }
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
// Generated assets stay in build/, never mutate the source website while packaging.
def bundledAssets = layout.buildDirectory.dir('generated/meetabWebAssets')
android.sourceSets.main.assets.srcDirs = [bundledAssets]
tasks.register('copyMeeTabWeb', Sync) {
    from('../../website'); into(bundledAssets.map { it.dir('www') })
    exclude 'MeeTab.json', 'Main Page.png', 'Calendar Page.png', 'Book a Meeting Page.png', 'Navbar.png', 'Weather-Overlay.png'
}
tasks.named('preBuild').configure { dependsOn(tasks.named('copyMeeTabWeb')) }
